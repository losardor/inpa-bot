services:
  inpa-bot:
    build: .
    image: inpa-bot:latest
    container_name: inpa-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/inpa-bot.db
    volumes:
      - data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
